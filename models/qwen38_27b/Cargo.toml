[package]
name = "ctox-qwen38-27b"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "Self-contained Qwen3.8-27B Q2/Q4 inference engine for CTOX"

[workspace]

[features]
default = ["cpu"]
cpu = []
cuda = ["dep:libloading"]
metal = ["dep:metal-driver"]
snapdragon = []
android-jni = ["dep:jni"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = "2"
half = { version = "2", features = ["serde"] }
jni = { version = "0.21", optional = true }
libloading = { version = "0.8", optional = true }
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
thiserror = "2"
tokenizers = { version = "0.23.1", default-features = false, features = ["fancy-regex"] }

[target.'cfg(target_os = "macos")'.dependencies]
metal-driver = { package = "metal", version = "0.33.0", optional = true }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

[[bin]]
name = "qwen38-memory-plan"
path = "src/bin/memory_plan.rs"

[[bin]]
name = "qwen38-verify"
path = "src/bin/verify.rs"

[[bin]]
name = "qwen38-server"
path = "src/bin/server.rs"

[[bin]]
name = "qwen38-kernel-bench"
path = "src/bin/kernel_bench.rs"

[[bin]]
name = "qwen38-roofline-gate"
path = "src/bin/roofline_gate.rs"

[[bin]]
name = "qwen38-tokenizer-check"
path = "src/bin/tokenizer_check.rs"

[[bin]]
name = "qwen38-metal-bench"
path = "src/bin/metal_bench.rs"
required-features = ["metal"]

[[bin]]
name = "qwen38-metal-fanout-bench"
path = "src/bin/metal_fanout_bench.rs"
required-features = ["metal"]

[[bin]]
name = "qwen38-metal-row-bench"
path = "src/bin/metal_row_bench.rs"
required-features = ["metal"]

[[bin]]
name = "qwen38-cuda-bench"
path = "src/bin/cuda_bench.rs"
required-features = ["cuda"]

[[bin]]
name = "qwen38-cuda-row-bench"
path = "src/bin/cuda_row_bench.rs"
required-features = ["cuda"]

[[bin]]
name = "qwen38-cuda-fanout-bench"
path = "src/bin/cuda_fanout_bench.rs"
required-features = ["cuda"]

[[bin]]
name = "qwen38-cuda-gated-delta-verify"
path = "src/bin/cuda_gated_delta_verify.rs"
required-features = ["cuda"]

[[bin]]
name = "qwen38-cuda-linear-ops-verify"
path = "src/bin/cuda_linear_ops_verify.rs"
required-features = ["cuda"]

[[bin]]
name = "qwen38-cuda-paged-gqa-verify"
path = "src/bin/cuda_paged_gqa_verify.rs"
required-features = ["cuda"]

[[bin]]
name = "qwen38-cuda-swiglu-a8-verify"
path = "src/bin/cuda_swiglu_a8_verify.rs"
required-features = ["cuda"]

[[bin]]
name = "qwen38-cuda-attention-gate-a8-verify"
path = "src/bin/cuda_attention_gate_a8_verify.rs"
required-features = ["cuda"]

[[bin]]
name = "qwen38-cuda-graph-load-verify"
path = "src/bin/cuda_graph_load_verify.rs"
required-features = ["cuda"]

[[bin]]
name = "qwen38-cuda-target-token-verify"
path = "src/bin/cuda_target_token_verify.rs"
required-features = ["cuda"]
